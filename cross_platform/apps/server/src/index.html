<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Guard Server</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="home-screen" class="screen home">
      <section class="stack">
        <header class="header">
          <h1>Exam Guard Server</h1>
          <p>Create a monitoring class</p>
        </header>

        <form id="room-form" class="form">
          <label>
            <span>Exam Name</span>
            <input id="exam-name" placeholder="e.g. Final Examination" />
          </label>
          <label>
            <span>Course / Module</span>
            <input id="course-name" placeholder="e.g. CS3010 Distributed Systems" />
          </label>
          <button id="create-button" type="submit" disabled>Start Monitoring</button>
          <small class="form-hint">A class code for students is created when you start.</small>
          <p id="room-error" class="error" hidden></p>
        </form>
      </section>
    </main>

    <main id="dashboard-screen" class="dashboard hidden">
      <header class="toolbar">
        <section>
          <h1 id="dashboard-title">Exam Monitoring</h1>
          <p id="dashboard-subtitle">0 connected</p>
        </section>

        <div class="toolbar-actions">
          <button id="join-code-chip" class="join-code-chip" type="button" hidden title="Click to copy">
            <span class="jc-label">Class code</span>
            <strong id="join-code">----</strong>
            <span id="join-port" class="jc-port"></span>
          </button>
          <input id="student-search" class="search" type="search" placeholder="Search name or ID" />
          <button id="remove-column" class="icon-button" type="button">-</button>
          <span id="column-label">1 column</span>
          <button id="add-column" class="icon-button" type="button">+</button>
          <button id="stop-button" class="danger" type="button">Stop Monitoring</button>
        </div>
      </header>

      <section id="empty-state" class="empty">
        <p class="empty-lbl">Students enter this code</p>
        <p id="banner-code" class="banner-code">----</p>
        <p id="banner-port" class="banner-port"></p>
        <div class="banner-actions">
          <button id="banner-copy" class="secondary" type="button">Copy</button>
          <button id="project-button" type="button">⛶ Project full screen</button>
        </div>
        <p class="empty-wait">Waiting for students to connect…</p>
      </section>
      <section id="student-grid" class="student-grid"></section>
      <footer class="session-bar">
        <label class="clear-toggle">
          <input id="clear-evidence" type="checkbox" />
          <span>Delete this session's screenshots when I finish</span>
        </label>
        <p id="log-dir" class="log-dir"></p>
      </footer>
    </main>

    <div id="projector" class="projector hidden">
      <p class="projector-label">JOIN CODE</p>
      <p id="projector-code" class="projector-code">----</p>
      <p class="projector-hint">Open Exam Guard and enter this code · press Esc to close</p>
    </div>

    <dialog id="student-dialog">
      <article>
        <header class="dialog-header">
          <section>
            <h2 id="dialog-name"></h2>
            <p id="dialog-id"></p>
          </section>
          <button id="close-dialog" class="icon-button" type="button">x</button>
        </header>
        <div id="dialog-image-wrap" class="dialog-image-wrap"></div>
      </article>
    </dialog>

    <span id="app-version" class="app-version"></span>
    <script type="module" src="./main.js"></script>
  </body>
</html>
